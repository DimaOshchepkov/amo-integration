server {
    listen 8082 ssl;
    http2 on;
    server_name amo.capibarov.fun;
    root /var/www/amo-integration/public;


    ssl_certificate /etc/letsencrypt/live/amo.capibarov.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amo.capibarov.fun/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
