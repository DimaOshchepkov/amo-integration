# amo.capibarov.fun — внутренний TLS-блок (по образцу flex на 8081).
# Внешний 443 обрабатывает stream-блок (ssl_preread), сюда трафик попадает по SNI.
# Установка: ln -s <repo>/deploy/nginx/amo.capibarov.fun.conf /etc/nginx/sites-enabled/

server {
    listen 8082 ssl;
    http2 on;
    server_name amo.capibarov.fun;

    ssl_certificate /etc/letsencrypt/live/amo.capibarov.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amo.capibarov.fun/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
